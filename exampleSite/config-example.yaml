baseURL: https://nodejh.github.io/hugo-theme-mini
locale: en-US
title: Hugo
theme: hugo-theme-mini
pagination:
  pagerSize: 3

# !!! exampleSite only, you may need to delete the line: `themesDir: ../../` 
