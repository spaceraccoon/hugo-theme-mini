{{ define "main" }}
{{ partial "profile.html" . }}
<section id="tags">
      {{ range .Data.Terms.ByCount }}
          {{ if .Name }}
              <span class="tag">
                  <a href="{{ .Page.RelPermalink }}">
                    {{ .Name }} <span>({{ .Count }})</span>
                </a>
              </span>
          {{ end }}
      {{ end }}
</section>
{{ end }}
